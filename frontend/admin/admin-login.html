<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - MediCare Pharmacy</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            color: #1976d2;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            color: #333;
            margin-bottom: 7px;
        }

        .title p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1976d2;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1565c0;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            text-decoration: none;
            color: #1976d2;
            font-size: 14px;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 25px 20px;
            }

            .logo {
                font-size: 23px;
            }

        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            MediCare Pharmacy
        </div>

        <div class="title">

            <h2>Admin Login</h2>

            <p>
                Login to manage the pharmacy store
            </p>

        </div>

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
            >

        </div>

        <button
            class="login-btn"
            onclick="adminLogin()">

            Login

        </button>

        <div
            id="message"
            class="message">
        </div>

        <div class="back-link">

            <a href="../user/index.html">
                ← Back to User Store
            </a>

        </div>

    </div>

</div>

<script>

   const API_URL = "https://online-pharmacy-store-g4n5.onrender.com"

    async function adminLogin() {

        const email =
            document.getElementById("email").value.trim()


        const password =
            document.getElementById("password").value


        if (email === "" || password === "") {

            showMessage(
                "Please enter email and password",
                "red"
            )

            return

        }


        try {

            const response = await fetch(
                `${API_URL}/admin/login`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            )


            const result = await response.json()


            if (result.status === "success") {

                const admin = result.data


                localStorage.setItem(
                    "admin_id",
                    admin.admin_id
                )


                localStorage.setItem(
                    "admin_name",
                    admin.admin_name
                )


                localStorage.setItem(
                    "admin_email",
                    admin.email
                )


                showMessage(
                    "Login successful",
                    "green"
                )


                setTimeout(() => {

                    window.location.href =
                        "dashboard.html"

                }, 500)

            }
            else {

                showMessage(
                    result.message || "Invalid login details",
                    "red"
                )

            }

        }
        catch (error) {

            console.log(error)

            showMessage(
                "Server error. Please try again.",
                "red"
            )

        }

    }


    function showMessage(message, color) {

        const messageBox =
            document.getElementById("message")

        messageBox.innerText = message

        messageBox.style.color = color

    }

</script>

</body>
</html>
